name: Temporary Clippy repair
on:
  push:
    branches:
      - formal/multi-method-wave6-20260925
    paths:
      - .github/workflows/temp-clippy-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: formal/multi-method-wave6-20260925
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Add narrow lint expectations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          edits = {
              'src/account.rs': (
                  'async fn throttle_code_attempt(',
                  '#[expect(clippy::result_large_err, reason = "route guard intentionally returns a fully formed Axum response on rejection")]\nasync fn throttle_code_attempt(',
              ),
              'src/api.rs': (
                  'async fn authenticate(',
                  '#[expect(clippy::result_large_err, reason = "API authentication failures are returned as fully formed JSON responses")]\nasync fn authenticate(',
              ),
              'src/auth.rs': (
                  'pub async fn require_full(',
                  '#[expect(clippy::result_large_err, reason = "route guard intentionally returns redirect responses for authentication failures")]\npub async fn require_full(',
              ),
          }
          for name, (old, new) in edits.items():
              path = Path(name)
              text = path.read_text()
              assert old in text, f'missing expected function marker: {name}'
              assert new not in text, f'lint expectation already present: {name}'
              path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Commit source-only repair
        run: |
          set -euo pipefail
          extra="$(git status --porcelain | grep -v -E '^ M src/(account|api|auth)\.rs$' || true)"
          test -z "$extra"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/account.rs src/api.rs src/auth.rs
          git commit -m 'fix: document intentional Axum response error guards'
          git push origin HEAD:formal/multi-method-wave6-20260925
